  - model_name: gpt-5.4-nano
    litellm_params:
      model: azure/gpt-5.4-nano
      litellm_credential_name: azure_openai
      tags: ["CEILING_UNCLASSIFIED"]
    model_info:
      base_model: azure/gpt-5.4-nano
      mode: chat

  # ---- Coding ------------------------------------------------------------
 
  - model_name: gpt-5.3-codex
    litellm_params:
      model: azure/gpt-5.3-codex
      litellm_credential_name: azure_openai
      tags: ["CEILING_UNCLASSIFIED"]
    model_info:
      base_model: azure/gpt-5.3-codex
      mode: chat
 
  # ---- Embeddings --------------------------------------------------------
  # Stable, no retirement pressure. Safe to build on.
 
  - model_name: text-embedding-3-large
    litellm_params:
      model: azure/text-embedding-3-large
      litellm_credential_name: azure_openai
      tags: ["CEILING_UNCLASSIFIED"]
    model_info:
      base_model: azure/text-embedding-3-large
      mode: embedding
 
  - model_name: text-embedding-3-small
    litellm_params:
      model: azure/text-embedding-3-small
      litellm_credential_name: azure_openai
      tags: ["CEILING_UNCLASSIFIED"]
    model_info:
      base_model: azure/text-embedding-3-small
      mode: embedding


router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

general_settings:
  use_redis_transaction_buffer: true
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  # Lets LiteLLM's azure-identity integration refresh the Entra ID access
  # token from AZURE_FEDERATED_TOKEN_FILE automatically instead of requiring
  # api_key on azure/* model entries above.
  enable_azure_ad_token_refresh: true
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD