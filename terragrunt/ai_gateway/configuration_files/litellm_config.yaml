      aws_region_name: ca-central-1
      aws_role_name: arn:aws:iam::986843603702:role/BedrockConsumer-litellm
      aws_session_name: "litellm-bedrock"
      tags: ["CEILING_UNCLASSIFIED"]

  # ── Azure OpenAI (workload identity, canary) ────────────────────────────
  # Auth is via Entra ID workload identity federation (AZURE_CLIENT_ID /
  # AZURE_TENANT_ID / AZURE_FEDERATED_TOKEN_FILE, see litellm_ecs.tf and
  # litellm_settings.enable_azure_ad_token_refresh below) -- no api_key.
  # TODO: model/deployment name is a placeholder. Set it to a real Azure
  # OpenAI deployment name once one exists (out of scope for this change;
  # creating azurerm_cognitive_deployment resources was explicitly deferred).
  # Convert additional azure/* models only after this one is verified
  # end-to-end (health check + real completion) per the rollout plan.
  # GPT-5.5 — the safe frontier pick. Released 2026-04-23, GA on Foundry.
  - model_name: gpt-5.5
    litellm_params:
      model: azure/gpt-5.5
      litellm_credential_name: azure_openai
      tags: ["CEILING_UNCLASSIFIED"]
    model_info:
      base_model: azure/gpt-5.5
      mode: chat
 
  # GPT-5.4 — GA on Foundry since March 2026.
  - model_name: gpt-5.4
    litellm_params:
      model: azure/gpt-5.4
      litellm_credential_name: azure_openai
      tags: ["CEILING_UNCLASSIFIED"]
    model_info:
